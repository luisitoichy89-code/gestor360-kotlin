name: Build Kotlin APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/gestor360.keystore
          fi

      - name: Create keystore.properties
        run: |
          echo "RELEASE_STORE_FILE=gestor360.keystore" > keystore.properties
          echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> keystore.properties
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> keystore.properties
          echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> keystore.properties

      - name: Build Release APK
        run: ./gradlew assembleRelease -PSUPABASE_URL=${{ secrets.SUPABASE_URL }} -PSUPABASE_KEY=${{ secrets.SUPABASE_KEY }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: gestor360-release-apk
          path: app/build/outputs/apk/release/app-release.apk
